name: Set up Masque toolchain
description: Go + Node + the Wails CLI (version pinned by go.mod), plus Linux webkit deps and version stamping.
inputs:
  version:
    description: Product version to stamp into wails.json (numeric x.y.z; NSIS and Info.plist need it)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install Linux build deps (GTK3 + WebKitGTK 4.1)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
    - name: Install Wails CLI
      shell: bash
      run: |
        WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
        go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: Stamp version into wails.json
      if: inputs.version != ''
      shell: bash
      run: |
        jq --arg v "${{ inputs.version }}" '.info.productVersion = $v' wails.json > wails.json.tmp
        mv wails.json.tmp wails.json
        echo "productVersion=$(jq -r .info.productVersion wails.json)"
