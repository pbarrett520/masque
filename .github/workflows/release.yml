name: Release

# Builds unsigned installers for all three platforms (spec M1.8), smoke-tests
# each on a clean runner, and on a v* tag opens a draft GitHub release with
# the artifacts attached. Also dry-runs (no release) whenever packaging
# files change on any branch, or on demand via workflow_dispatch.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # paths filters are not applied to tag pushes, so tags always build.
    paths:
      - ".github/workflows/release.yml"
      - ".github/actions/**"
      - "build/**"
      - "wails.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          # NSIS and Info.plist need a plain numeric x.y.z; untagged runs are 0.0.0.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like vX.Y.Z (got $GITHUB_REF_NAME)"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (AppImage + deb)
    needs: version
    # Oldest supported glibc: the AppImage bundles GTK + WebKitGTK from here.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          version: ${{ env.VERSION }}
      - name: Install packaging deps
        run: |
          sudo apt-get install -y --no-install-recommends \
            file desktop-file-utils librsvg2-dev libgtk-3-bin libgdk-pixbuf2.0-bin libglib2.0-bin
      - name: Build binary
        run: wails build -tags webkit2_41 -trimpath -clean -m -nosyncgomod
      - name: Build AppImage
        run: build/linux/appimage.sh dist
      - name: Build deb
        run: build/linux/deb.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  smoke-appimage:
    name: Smoke AppImage (clean Ubuntu 24.04)
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: build/smoke.sh
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - name: Remove system WebKitGTK; keep only a bare desktop baseline
        # linuxdeploy bundles GTK + WebKit but, by AppImage convention, leaves
        # what every graphical desktop already has to the host: fontconfig,
        # harfbuzz/fribidi, wayland-client, Mesa GL/EGL/GLES, fonts. Install
        # exactly that so the test reflects "desktop machine without WebKitGTK".
        run: |
          sudo apt-get remove -y 'libwebkit2gtk-4.1-0' 'libwebkit2gtk-4.0-37' 'libjavascriptcoregtk-4*' 2>/dev/null || true
          sudo apt-get install -y --no-install-recommends xvfb \
            libfontconfig1 libharfbuzz0b libfribidi0 libwayland-client0 \
            libegl1 libgl1 libgles2 libgbm1 fonts-dejavu-core
          ! ldconfig -p | grep -q libwebkit2gtk
      - name: Launch under Xvfb
        run: |
          chmod +x dist/*.AppImage build/smoke.sh
          xvfb-run -a build/smoke.sh -t 20 dist/Masque-*.AppImage --appimage-extract-and-run

  smoke-deb:
    name: Smoke deb (clean Ubuntu 24.04)
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: build/smoke.sh
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - name: Install package (pulls webkit2gtk from apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb ./dist/masque_*.deb
          command -v masque
      - name: Launch under Xvfb
        run: |
          chmod +x build/smoke.sh
          xvfb-run -a build/smoke.sh -t 20 masque

  windows:
    name: Windows (NSIS)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          version: ${{ env.VERSION }}
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
      - name: Build binary + installer
        shell: bash
        run: |
          makensis -VERSION
          wails build -platform windows/amd64 -nsis -webview2 download -trimpath -clean -m -nosyncgomod
          ls -la build/bin
          mkdir -p dist
          cp build/bin/masque-amd64-installer.exe "dist/Masque-$VERSION-windows-amd64-installer.exe"
          cp build/bin/masque.exe "dist/Masque-$VERSION-windows-amd64-portable.exe"
      - name: Silent install + launch
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Masque-$env:VERSION-windows-amd64-installer.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $exe = "C:\Program Files\Masque\masque.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem "C:\Program Files" -Recurse -Filter masque.exe -ErrorAction SilentlyContinue; throw "installed exe not found at $exe" }
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "masque.exe exited early with code $($app.ExitCode)" }
          Write-Host "smoke: masque.exe still running after 20s - OK"
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (universal dmg)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          version: ${{ env.VERSION }}
      - name: Build universal .app
        run: wails build -platform darwin/universal -trimpath -clean -m -nosyncgomod
      - name: Build dmg
        run: build/darwin/dmg.sh dist
      - name: Mount dmg + launch
        run: |
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" dist/Masque-*.dmg
          ls -la "$MNT"
          cp -R "$MNT/Masque.app" "$RUNNER_TEMP/Masque.app"
          hdiutil detach "$MNT"
          codesign --verify --deep --strict "$RUNNER_TEMP/Masque.app"
          lipo -info "$RUNNER_TEMP/Masque.app/Contents/MacOS/masque"
          build/smoke.sh -t 20 "$RUNNER_TEMP/Masque.app/Contents/MacOS/masque"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [version, smoke-appimage, smoke-deb, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "Masque $VERSION" \
            --notes "Unsigned builds (spec M1.8). macOS: right-click > Open on first launch, or \`xattr -cr /Applications/Masque.app\`. Windows: SmartScreen will warn once. Linux: the AppImage bundles WebKitGTK; the .deb uses the distro's webkit2gtk-4.1." \
            dist/*
